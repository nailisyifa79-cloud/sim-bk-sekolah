<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIM BK - Sistem Informasi Manajemen BK</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Segoe UI',Arial,sans-serif;background:linear-gradient(135deg,#0d3b6b,#1a5a9e);display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px}
        .container{background:#fff;padding:40px;border-radius:16px;max-width:400px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,0.3)}
        .logo{text-align:center;margin-bottom:20px}
        .logo h1{font-size:36px;color:#0d3b6b}
        .logo h1 span{color:#f4b400}
        .logo p{color:#888;font-size:14px;margin-top:4px}
        .alert{padding:12px 16px;border-radius:8px;margin-bottom:16px;font-size:13px;display:none}
        .alert.show{display:block}
        .alert-danger{background:#fde8e8;color:#c0392b;border-left:4px solid #c0392b}
        .alert-success{background:#e8f8ed;color:#27ae60;border-left:4px solid #27ae60}
        .form-group{margin-bottom:14px}
        .form-group label{display:block;font-size:13px;font-weight:600;color:#555;margin-bottom:4px}
        .form-group input{width:100%;padding:12px 14px;border:2px solid #e0e0e0;border-radius:8px;font-size:14px;transition:border-color .3s}
        .form-group input:focus{border-color:#1a5a9e;outline:none;box-shadow:0 0 0 3px rgba(26,90,158,0.1)}
        .btn{width:100%;padding:13px;border:0;border-radius:8px;font-size:16px;font-weight:600;cursor:pointer;transition:all .3s;color:#fff}
        .btn-primary{background:#1a5a9e}
        .btn-primary:hover{background:#0d3b6b;transform:translateY(-1px)}
        .btn-danger{background:#e74c3c}
        .btn-danger:hover{background:#c0392b}
        .demo-info{background:#f0f4f8;padding:12px;border-radius:8px;font-size:12px;color:#666;text-align:center;margin-top:16px}
        .demo-info strong{color:#0d3b6b}
        .dashboard{text-align:center}
        .dashboard .greeting{font-size:20px;font-weight:600;color:#0d3b6b;margin-bottom:8px}
        .dashboard .email{color:#888;font-size:14px;margin-bottom:16px}
        .dashboard .card{background:#f0f4f8;padding:20px;border-radius:12px;margin:16px 0}
        .dashboard .card .icon{font-size:32px;margin-bottom:8px}
        .dashboard .card p{color:#555;font-size:14px}
        .dashboard .card .small{font-size:12px;color:#999;margin-top:8px}
        .status-badge{display:inline-block;background:#27ae60;color:#fff;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:600}
        .btn-logout{background:#e74c3c;color:#fff;border:0;padding:12px;border-radius:8px;cursor:pointer;font-weight:600;width:100%;font-size:16px;transition:all .3s}
        .btn-logout:hover{background:#c0392b;transform:translateY(-1px)}
    </style>
</head>
<body>

<div class="container" id="app">
    <!-- Login Page -->
    <div id="loginPage">
        <div class="logo">
            <h1>SIM <span>BK</span></h1>
            <p>Sistem Informasi Manajemen BK</p>
        </div>
        <div id="loginAlert" class="alert"></div>
        <div class="form-group">
            <label>📧 Email</label>
            <input type="email" id="loginEmail" placeholder="Masukkan email" value="admin@sekolah.com">
        </div>
        <div class="form-group">
            <label>🔒 Password</label>
            <input type="password" id="loginPassword" placeholder="Masukkan password" value="admin123">
        </div>
        <button class="btn btn-primary" id="loginBtn">🚀 Masuk</button>
        <div class="demo-info">
            💡 <strong>Demo:</strong> admin@sekolah.com | admin123
        </div>
    </div>
</div>

<script>
// ============================================
//   DATABASE (LocalStorage)
// ============================================

function getUsers() {
    try { return JSON.parse(localStorage.getItem('SIMBK_USERS')) || {}; } 
    catch(e) { return {}; }
}

function saveUsers(users) {
    localStorage.setItem('SIMBK_USERS', JSON.stringify(users));
}

function getSession() {
    try { return JSON.parse(localStorage.getItem('SIMBK_SESSION')); } 
    catch(e) { return null; }
}

function saveSession(email) {
    localStorage.setItem('SIMBK_SESSION', JSON.stringify({ 
        email: email, 
        loginAt: new Date().toISOString() 
    }));
}

function clearSession() {
    localStorage.removeItem('SIMBK_SESSION');
}

// ============================================
//   SEED DATA
// ============================================

function seedUsers() {
    let users = getUsers();
    if (Object.keys(users).length === 0) {
        users = {
            "admin@sekolah.com": {
                password: "admin123",
                school: "SMKN 3 Tegal",
                role: "admin",
                registeredAt: new Date().toISOString()
            }
        };
        saveUsers(users);
    }
}

// Jalankan seed
seedUsers();

// ============================================
//   LOGIN - VERSION 2 (Lebih Stabil)
// ============================================

function handleLogin() {
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value.trim();
    const alertEl = document.getElementById('loginAlert');
    
    alertEl.className = 'alert';
    alertEl.textContent = '';
    
    if (!email || !password) {
        alertEl.className = 'alert alert-danger show';
        alertEl.textContent = '⚠️ Email dan password harus diisi!';
        return;
    }
    
    const users = getUsers();
    
    if (!users[email]) {
        alertEl.className = 'alert alert-danger show';
        alertEl.textContent = '⚠️ Email tidak terdaftar! Gunakan: admin@sekolah.com';
        return;
    }
    
    if (users[email].password !== password) {
        alertEl.className = 'alert alert-danger show';
        alertEl.textContent = '⚠️ Password salah! Gunakan: admin123';
        return;
    }
    
    // Login sukses
    saveSession(email);
    alertEl.className = 'alert alert-success show';
    alertEl.textContent = '✅ Login berhasil!';
    
    setTimeout(showDashboard, 500);
}

// ============================================
//   DASHBOARD
// ============================================

function showDashboard() {
    const session = getSession();
    if (!session || !session.email) {
        location.reload();
        return;
    }
    
    const users = getUsers();
    const user = users[session.email] || {};
    
    document.getElementById('loginPage').innerHTML = `
        <div class="dashboard">
            <div class="logo">
                <h1>📚 SIM <span>BK</span></h1>
            </div>
            <div class="greeting">Selamat Datang!</div>
            <div class="email">${session.email}</div>
            <span class="status-badge">✅ Aktif</span>
            <div class="card">
                <div class="icon">🏫</div>
                <p><strong>${user.school || 'Sekolah'}</strong></p>
                <p class="small">Role: ${user.role || 'Admin'} • Login: ${new Date(session.loginAt).toLocaleString()}</p>
            </div>
            <div class="card" style="background:#e8f4fd;">
                <div class="icon">💾</div>
                <p><strong>Data Tersimpan</strong></p>
                <p class="small">Aplikasi berjalan dengan localStorage</p>
            </div>
            <button class="btn-logout" onclick="handleLogout()">🚪 Keluar</button>
        </div>
    `;
}

// ============================================
//   LOGOUT
// ============================================

function handleLogout() {
    clearSession();
    location.reload();
}

// ============================================
//   CEK SESSION
// ============================================

function checkSession() {
    const session = getSession();
    if (session && session.email) {
        const users = getUsers();
        if (users[session.email]) {
            showDashboard();
            return true;
        }
    }
    return false;
}

// ============================================
//   INIT - Event Listener Lebih Stabil
// ============================================

// Hapus semua event listener lama (jika ada)
document.querySelectorAll('#loginBtn').forEach(el => {
    el.replaceWith(el.cloneNode(true));
});

// Pasang event listener baru
document.addEventListener('DOMContentLoaded', function() {
    // Cek session
    if (!checkSession()) {
        // Login button
        const btn = document.getElementById('loginBtn');
        if (btn) {
            btn.addEventListener('click', handleLogin);
        }
        
        // Enter key
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                const loginPage = document.getElementById('loginPage');
                if (loginPage && loginPage.innerHTML.includes('Masuk')) {
                    handleLogin();
                }
            }
        });
    }
});

// Juga jalankan langsung (untuk berjaga-jaga)
if (!checkSession()) {
    const btn = document.getElementById('loginBtn');
    if (btn) {
        btn.addEventListener('click', handleLogin);
    }
}

console.log('🚀 SIM BK v2.0 - Siap digunakan!');
console.log('📧 Akun: admin@sekolah.com / admin123');
</script>

</body>
</html>
