<!DOCTYPE html>
<html>
<head>
    <title>SIM BK</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:Arial;background:linear-gradient(135deg,#0d3b6b,#1a5a9e);display:flex;justify-content:center;align-items:center;min-height:100vh}
        .box{background:#fff;padding:40px;border-radius:12px;max-width:400px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,0.3)}
        .box h1{text-align:center;font-size:32px;color:#0d3b6b}
        .box h1 span{color:#f4b400}
        .box p{text-align:center;color:#666;margin-bottom:20px}
        input{width:100%;padding:12px;border:2px solid #ddd;border-radius:8px;margin-bottom:12px;font-size:14px}
        input:focus{border-color:#1a5a9e;outline:none}
        button{width:100%;padding:12px;border:0;border-radius:8px;font-size:16px;font-weight:bold;cursor:pointer;color:#fff;background:#1a5a9e}
        button:hover{background:#0d3b6b}
        .alert{padding:10px;border-radius:6px;margin-bottom:12px;font-size:13px}
        .alert-danger{background:#f8d7da;color:#721c24;border:1px solid #f5c6cb}
        .alert-success{background:#d4edda;color:#155724;border:1px solid #c3e6cb}
        .demo{background:#f0f4f8;padding:10px;border-radius:6px;font-size:11px;color:#666;text-align:center;margin-top:12px}
    </style>
</head>
<body>

<div class="box" id="loginPage">
    <h1>SIM <span>BK</span></h1>
    <p>Sistem Informasi Manajemen BK</p>
    <div id="loginAlert"></div>
    <input type="email" id="loginEmail" placeholder="Email" value="admin@sekolah.com">
    <input type="password" id="loginPassword" placeholder="Password" value="admin123">
    <button onclick="handleLogin()">🚀 Masuk</button>
    <div class="demo">💡 <b>Demo:</b> admin@sekolah.com | admin123</div>
</div>

<script>
// ============ LOCAL STORAGE ============
function getUsers() {
    try { return JSON.parse(localStorage.getItem('SIMBK_USERS')) || {}; } catch(e) { return {}; }
}
function saveUsers(users) { localStorage.setItem('SIMBK_USERS', JSON.stringify(users)); }
function getSession() {
    try { return JSON.parse(localStorage.getItem('SIMBK_SESSION')); } catch(e) { return null; }
}
function saveSession(email) { localStorage.setItem('SIMBK_SESSION', JSON.stringify({ email: email })); }
function clearSession() { localStorage.removeItem('SIMBK_SESSION'); }

// ============ BUAT USER DEMO OTOMATIS ============
var users = getUsers();
if (Object.keys(users).length === 0) {
    users["admin@sekolah.com"] = {
        password: "admin123",
        school: "Sekolah Demo",
        registeredAt: new Date().toISOString(),
        role: "admin"
    };
    saveUsers(users);
    console.log('✅ User demo otomatis dibuat');
}

// ============ LOGIN ============
function handleLogin() {
    var email = document.getElementById('loginEmail').value.trim();
    var password = document.getElementById('loginPassword').value.trim();
    var alertEl = document.getElementById('loginAlert');
    
    if (!email || !password) {
        alertEl.innerHTML = '<div class="alert alert-danger">⚠️ Email dan password harus diisi!</div>';
        return;
    }
    
    var users = getUsers();
    if (!users[email]) {
        alertEl.innerHTML = '<div class="alert alert-danger">⚠️ Email tidak terdaftar!</div>';
        return;
    }
    if (users[email].password !== password) {
        alertEl.innerHTML = '<div class="alert alert-danger">⚠️ Password salah!</div>';
        return;
    }
    
    saveSession(email);
    alertEl.innerHTML = '<div class="alert alert-success">✅ Login berhasil! Mengarahkan...</div>';
    
    setTimeout(function() {
        document.getElementById('loginPage').innerHTML = `
            <h1>📚 SIM <span>BK</span></h1>
            <p style="font-weight:bold;color:#0d3b6b;">Selamat datang, ${email}</p>
            <div style="background:#f0f4f8;padding:16px;border-radius:8px;margin:12px 0;">
                <p>✅ Aplikasi berhasil diakses!</p>
                <p style="font-size:12px;color:#666;margin-top:8px;">Data Anda aman di Firebase.</p>
            </div>
            <button onclick="handleLogout()" style="background:#d96b7b;">🚪 Keluar</button>
        `;
    }, 1000);
}

// ============ LOGOUT ============
function handleLogout() {
    clearSession();
    location.reload();
}

// ============ CEK SESSION ============
var session = getSession();
if (session && session.email) {
    var users = getUsers();
    if (users[session.email]) {
        document.getElementById('loginPage').innerHTML = `
            <h1>📚 SIM <span>BK</span></h1>
            <p style="font-weight:bold;color:#0d3b6b;">Selamat datang, ${session.email}</p>
            <div style="background:#f0f4f8;padding:16px;border-radius:8px;margin:12px 0;">
                <p>✅ Aplikasi berhasil diakses!</p>
                <p style="font-size:12px;color:#666;margin-top:8px;">Data Anda aman di Firebase.</p>
            </div>
            <button onclick="handleLogout()" style="background:#d96b7b;">🚪 Keluar</button>
        `;
    }
}

// ============ ENTER KEY ============
document.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
        if (document.getElementById('loginPage').innerHTML.includes('Masuk')) {
            handleLogin();
        }
    }
});
</script>
</body>
</html>
